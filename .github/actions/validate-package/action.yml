name: Validate package
description: Install the locked package and verify every published Pi resource

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: |
          package-lock.json
          tests/smoke-runtime/package-lock.json

    - name: Use the repository npm version
      shell: bash
      run: npm install --global npm@11.16.0

    - name: Install package dependencies
      shell: bash
      run: npm ci --ignore-scripts

    - name: Run production-install-safe package tests
      shell: bash
      run: npm run test:package

    - name: Install smoke-test Pi runtime
      shell: bash
      run: npm --prefix tests/smoke-runtime ci --include=dev --ignore-scripts

    - name: Run Pi runtime tests
      shell: bash
      run: npm run test:runtime

    - name: Run smoke test
      shell: bash
      run: npm run smoke
