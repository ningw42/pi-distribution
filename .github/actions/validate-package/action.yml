name: Validate package
description: Install the locked package and verify every published Pi resource

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version: 24
        cache: npm

    - name: Use the repository npm version
      shell: bash
      run: npm install --global npm@11.16.0

    - name: Install package dependencies
      shell: bash
      run: npm ci --ignore-scripts

    - name: Install smoke-test Pi runtime
      shell: bash
      run: npm --prefix tests/smoke-runtime ci --ignore-scripts

    - name: Run package checks
      shell: bash
      run: npm test

    - name: Run smoke test
      shell: bash
      run: npm run smoke
