name: Build & Publish GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate calendar-versioned tag
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]{2}\.(0[1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]]

      - name: Checkout tagged source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate tagged package
        uses: ./.github/actions/validate-package

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if release="$(gh api "repos/$REPOSITORY/releases/tags/$TAG" 2>/dev/null)"; then
            jq -e --arg tag "$TAG" \
              '.tag_name == $tag and .draft == false and .prerelease == false' \
              <<< "$release" >/dev/null
            echo "GitHub Release $TAG already exists."
            exit 0
          fi

          payload="$(jq -n --arg tag "$TAG" '{
            tag_name: $tag,
            name: $tag,
            draft: false,
            prerelease: false
          }')"
          if gh api --method POST "repos/$REPOSITORY/releases" --input - <<< "$payload"; then
            echo "Published GitHub Release $TAG."
            exit 0
          fi

          release="$(gh api "repos/$REPOSITORY/releases/tags/$TAG")"
          jq -e --arg tag "$TAG" \
            '.tag_name == $tag and .draft == false and .prerelease == false' \
            <<< "$release" >/dev/null
          echo "GitHub Release $TAG was created concurrently."
