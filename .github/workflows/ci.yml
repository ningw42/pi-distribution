name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test-${{ matrix.os }}-${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            architecture: x64
            runner: ubuntu-latest
          - os: windows
            architecture: x64
            runner: windows-latest
          - os: windows
            architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Validate package
        uses: ./.github/actions/validate-package
