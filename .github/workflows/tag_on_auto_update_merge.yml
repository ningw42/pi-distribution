name: Tag on Auto-Update Merge

on:
  pull_request:
    types: [closed]

concurrency:
  group: auto-tag-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'renovate/dependencies' &&
      github.event.pull_request.user.login == vars.RENOVATE_ACTOR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      update-class: ${{ steps.validate.outputs.update-class }}
      base-sha: ${{ steps.validate.outputs.base-sha }}
    steps:
      - name: Checkout exact merged commit without credentials
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize and validate update using pre-merge tooling
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RENOVATE_ACTOR: ${{ vars.RENOVATE_ACTOR }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse "$MERGE_SHA^")"
          mkdir -p "$RUNNER_TEMP/trusted"
          git archive "$base_sha" \
            scripts/validate-auto-update.mjs scripts/validate-npm-update.mjs scripts/rtk-candidate.mjs \
            | tar -x -C "$RUNNER_TEMP/trusted"
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          gh api --paginate --slurp "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            | jq 'add' > "$RUNNER_TEMP/files.json"
          update_class="$(node "$RUNNER_TEMP/trusted/scripts/validate-auto-update.mjs" \
            "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/files.json" "$base_sha" "$MERGE_SHA")"
          echo "update-class=$update_class" >> "$GITHUB_OUTPUT"
          echo "base-sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Validate merged package without release credentials
        uses: ./.github/actions/validate-package

  tag:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Never execute validation code supplied by the update PR with this PAT.
      - name: Checkout pre-merge tooling with release credential
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.base-sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Reauthorize live PR and exact merged contents
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RENOVATE_ACTOR: ${{ vars.RENOVATE_ACTOR }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BASE_SHA: ${{ needs.validate.outputs.base-sha }}
          UPDATE_CLASS: ${{ needs.validate.outputs.update-class }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$MERGE_SHA"
          [[ "$(git rev-parse "$MERGE_SHA^")" == "$BASE_SHA" ]]
          gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          gh api --paginate --slurp "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            | jq 'add' > "$RUNNER_TEMP/files.json"
          actual="$(node scripts/validate-auto-update.mjs \
            "$RUNNER_TEMP/pr.json" "$RUNNER_TEMP/files.json" "$BASE_SHA" "$MERGE_SHA")"
          [[ "$actual" == "$UPDATE_CLASS" ]]

      - name: Allocate and push calendar-versioned tag
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          UPDATE_CLASS: ${{ needs.validate.outputs.update-class }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --tags --quiet
          git merge-base --is-ancestor "$MERGE_SHA" origin/master

          allocate_tag() {
            git fetch origin --tags --quiet
            local latest_tag="" latest_target="" latest_y=-1 latest_m=-1 latest_n=-1
            local now_y now_m month_max=-1 tag target y m n
            now_y=$((10#$(date -u +%y)))
            now_m=$((10#$(date -u +%m)))

            while IFS= read -r tag; do
              [[ "$tag" =~ ^v([0-9]{2})\.(0[1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]] || continue
              y=$((10#${BASH_REMATCH[1]}))
              m=$((10#${BASH_REMATCH[2]}))
              n=$((10#${BASH_REMATCH[3]}))
              target="$(git rev-parse "$tag^{commit}")"
              if [[ "$target" == "$MERGE_SHA" ]]; then
                echo "$MERGE_SHA is already tagged as $tag; nothing to do."
                exit 0
              fi
              if (( y > latest_y || (y == latest_y && m > latest_m) || (y == latest_y && m == latest_m && n > latest_n) )); then
                latest_tag="$tag"; latest_target="$target"; latest_y=$y; latest_m=$m; latest_n=$n
              fi
              if (( y == now_y && m == now_m && n > month_max )); then month_max=$n; fi
            done < <(git tag --list)

            if [[ -n "$latest_target" ]]; then
              if git merge-base --is-ancestor "$MERGE_SHA" "$latest_target"; then
                echo "$MERGE_SHA is already included in newer $latest_tag; nothing to do."
                exit 0
              fi
              git merge-base --is-ancestor "$latest_target" "$MERGE_SHA" || {
                echo "$MERGE_SHA diverges from latest release $latest_tag" >&2
                exit 1
              }
              if (( latest_y > now_y || (latest_y == now_y && latest_m > now_m) )); then
                echo "latest release $latest_tag is later than the current UTC month" >&2
                exit 1
              fi
            fi

            NEXT_TAG="$(printf 'v%02d.%02d.%d' "$now_y" "$now_m" "$((month_max + 1))")"
          }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Tag allocation attempt $attempt/5"
            allocate_tag
            printf 'pi-distribution %s\nPR: #%s %s\nClass: %s\nTarget: %s\n' \
              "$NEXT_TAG" "$PR_NUMBER" "$PR_TITLE" "$UPDATE_CLASS" "$MERGE_SHA" \
              | git tag -a "$NEXT_TAG" "$MERGE_SHA" -F -
            if git push origin "refs/tags/$NEXT_TAG:refs/tags/$NEXT_TAG"; then
              echo "Created and pushed $NEXT_TAG."
              exit 0
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$NEXT_TAG" >/dev/null 2>&1; then
              echo "Tag allocation collision for $NEXT_TAG; retrying."
              git tag -d "$NEXT_TAG"
              continue
            fi
            echo "tag push failed for a reason other than a name collision" >&2
            exit 1
          done
          echo "could not allocate a tag after five attempts" >&2
          exit 1
