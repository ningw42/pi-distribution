name: Tag on Auto-Update Merge

on:
  pull_request:
    types: [closed]

concurrency:
  group: auto-tag-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      update-class: ${{ steps.classify.outputs.update-class }}
    steps:
      - name: Classify changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[].filename' | sort
          )
          [[ "${#changed[@]}" -gt 0 ]]

          has_label() {
            jq -e --arg label "$1" 'index($label) != null' <<< "$LABELS" >/dev/null
          }

          if [[ "$AUTHOR" == "renovate[bot]" && "$HEAD_REF" == renovate/npm-* ]] \
            && has_label auto-release:npm; then
            expected=$'package-lock.json\npackage.json'
            [[ "$(printf '%s\n' "${changed[@]}")" == "$expected" ]]
            echo "update-class=npm" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$AUTHOR" == "github-actions[bot]" && "$HEAD_REF" == auto-update/pi-rtk-* ]] \
            && has_label auto-release:pi-rtk; then
            printf '%s\n' "${changed[@]}" | grep -Fxq vendor/pi-rtk/metadata.json
            allowed=$'vendor/pi-rtk/LICENSE\nvendor/pi-rtk/index.ts\nvendor/pi-rtk/metadata.json'
            for path in "${changed[@]}"; do
              grep -Fxq "$path" <<< "$allowed" || {
                echo "unexpected pi-rtk update path: $path" >&2
                exit 1
              }
            done
            echo "update-class=pi-rtk" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "merged PR is not a trusted automatic-release update" >&2
          exit 1

      - name: Checkout exact merged commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate update semantics
        env:
          UPDATE_CLASS: ${{ steps.classify.outputs.update-class }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA"
          if [[ "$UPDATE_CLASS" == npm ]]; then
            node scripts/validate-npm-update.mjs "$BASE_SHA"
          else
            node <<'NODE'
          const assert = require("node:assert/strict");
          const { createHash } = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const { readFileSync } = require("node:fs");
          const base = JSON.parse(execFileSync("git", ["show", `${process.env.BASE_SHA}:vendor/pi-rtk/metadata.json`], { encoding: "utf8" }));
          const head = JSON.parse(readFileSync("vendor/pi-rtk/metadata.json", "utf8"));
          const numbers = (value) => value.split(".").map(Number);
          const compare = (left, right) => {
            const a = numbers(left), b = numbers(right);
            return a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
          };
          assert.ok(compare(head.version, base.version) > 0, "pi-rtk update must advance the RTK version");
          assert.equal(head.upstreamRepository, "rtk-ai/rtk");
          assert.equal(head.tag, `v${head.version}`);
          assert.equal(head.generatorCommand, "rtk init -g --agent pi --no-patch");
          assert.equal(head.upstreamSourcePath, "hooks/pi/rtk.ts");
          const hash = (path) => createHash("sha256").update(readFileSync(path)).digest("hex");
          assert.equal(hash("vendor/pi-rtk/index.ts"), head.generatedSourceSha256);
          assert.equal(hash("vendor/pi-rtk/LICENSE"), head.licenseSha256);
          console.log(`RTK ${base.version} -> ${head.version}`);
          NODE
          fi

      - name: Validate merged package
        uses: ./.github/actions/validate-package

  tag:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout exact merged commit with release credential
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Reauthorize update class
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          author="$(jq -r '.user.login' <<< "$pr")"
          head_ref="$(jq -r '.head.ref' <<< "$pr")"
          head_repository="$(jq -r '.head.repo.full_name' <<< "$pr")"
          base_ref="$(jq -r '.base.ref' <<< "$pr")"
          merged="$(jq -r '.merged' <<< "$pr")"
          live_merge_sha="$(jq -r '.merge_commit_sha' <<< "$pr")"
          labels="$(jq '[.labels[].name]' <<< "$pr")"
          [[ "$merged" == true && "$base_ref" == master && "$head_repository" == "$REPOSITORY" ]]
          [[ "$live_merge_sha" == "$EVENT_MERGE_SHA" ]]

          mapfile -t changed < <(
            gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[].filename' | sort
          )
          if [[ "$author" == "renovate[bot]" && "$head_ref" == renovate/npm-* ]] \
            && jq -e 'index("auto-release:npm") != null' <<< "$labels" >/dev/null; then
            [[ "$(printf '%s\n' "${changed[@]}")" == $'package-lock.json\npackage.json' ]]
            exit 0
          fi
          if [[ "$author" == "github-actions[bot]" && "$head_ref" == auto-update/pi-rtk-* ]] \
            && jq -e 'index("auto-release:pi-rtk") != null' <<< "$labels" >/dev/null; then
            printf '%s\n' "${changed[@]}" | grep -Fxq vendor/pi-rtk/metadata.json
            allowed=$'vendor/pi-rtk/LICENSE\nvendor/pi-rtk/index.ts\nvendor/pi-rtk/metadata.json'
            for path in "${changed[@]}"; do grep -Fxq "$path" <<< "$allowed"; done
            exit 0
          fi
          echo "PR authorization changed after validation" >&2
          exit 1

      - name: Allocate and push calendar-versioned tag
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          UPDATE_CLASS: ${{ needs.validate.outputs.update-class }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --tags --quiet
          git merge-base --is-ancestor "$MERGE_SHA" origin/master

          allocate_tag() {
            git fetch origin --tags --quiet
            local latest_tag="" latest_target="" latest_y=-1 latest_m=-1 latest_n=-1
            local now_y now_m month_max=-1 tag target y m n
            now_y=$((10#$(date -u +%y)))
            now_m=$((10#$(date -u +%m)))

            while IFS= read -r tag; do
              [[ "$tag" =~ ^v([0-9]{2})\.(0[1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]] || continue
              y=$((10#${BASH_REMATCH[1]}))
              m=$((10#${BASH_REMATCH[2]}))
              n=$((10#${BASH_REMATCH[3]}))
              target="$(git rev-parse "$tag^{commit}")"
              if [[ "$target" == "$MERGE_SHA" ]]; then
                echo "$MERGE_SHA is already tagged as $tag; nothing to do."
                exit 0
              fi
              if (( y > latest_y || (y == latest_y && m > latest_m) || (y == latest_y && m == latest_m && n > latest_n) )); then
                latest_tag="$tag"; latest_target="$target"; latest_y=$y; latest_m=$m; latest_n=$n
              fi
              if (( y == now_y && m == now_m && n > month_max )); then month_max=$n; fi
            done < <(git tag --list)

            if [[ -n "$latest_target" ]]; then
              if git merge-base --is-ancestor "$MERGE_SHA" "$latest_target"; then
                echo "$MERGE_SHA is already included in newer $latest_tag; nothing to do."
                exit 0
              fi
              git merge-base --is-ancestor "$latest_target" "$MERGE_SHA" || {
                echo "$MERGE_SHA diverges from latest release $latest_tag" >&2
                exit 1
              }
              if (( latest_y > now_y || (latest_y == now_y && latest_m > now_m) )); then
                echo "latest release $latest_tag is later than the current UTC month" >&2
                exit 1
              fi
            fi

            NEXT_TAG="$(printf 'v%02d.%02d.%d' "$now_y" "$now_m" "$((month_max + 1))")"
          }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Tag allocation attempt $attempt/5"
            allocate_tag
            printf 'pi-distribution %s\nPR: #%s %s\nClass: %s\nTarget: %s\n' \
              "$NEXT_TAG" "$PR_NUMBER" "$PR_TITLE" "$UPDATE_CLASS" "$MERGE_SHA" \
              | git tag -a "$NEXT_TAG" "$MERGE_SHA" -F -
            if git push origin "refs/tags/$NEXT_TAG:refs/tags/$NEXT_TAG"; then
              echo "Created and pushed $NEXT_TAG."
              exit 0
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$NEXT_TAG" >/dev/null 2>&1; then
              echo "Tag allocation collision for $NEXT_TAG; retrying."
              git tag -d "$NEXT_TAG"
              continue
            fi
            echo "tag push failed for a reason other than a name collision" >&2
            exit 1
          done
          echo "could not allocate a tag after five attempts" >&2
          exit 1
